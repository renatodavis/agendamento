name: Deploy em todos os clientes

on:
  push:
    branches: [main]
    paths-ignore:
      - "clients.json"   # commit do próprio workflow não dispara loop
      - "**.md"
      - "playbooks/**"

jobs:
  listar:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
      tem_clientes: ${{ steps.read.outputs.tem_clientes }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: |
          # Filtra entradas sem supabase_project_id (cliente ainda não provisionado)
          MATRIX=$(jq -c '[.[] | select(.supabase_project_id != "" and .vercel_project_id != "")]' clients.json)
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          COUNT=$(echo "$MATRIX" | jq 'length')
          echo "tem_clientes=$([ "$COUNT" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: listar
    if: needs.listar.outputs.tem_clientes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false          # falha em um cliente não cancela os outros
      matrix:
        cliente: ${{ fromJson(needs.listar.outputs.matrix) }}

    name: ${{ matrix.cliente.slug }}

    steps:
      - uses: actions/checkout@v4

      - name: Aplicar migrações — ${{ matrix.cliente.slug }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          PROJECT_REF="${{ matrix.cliente.supabase_project_id }}"
          API="https://api.supabase.com/v1/projects/$PROJECT_REF/database/query"

          run_sql() {
            curl -sf -X POST "$API" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              --data-raw "{\"query\": $(jq -Rs . <<< "$1")}"
          }

          # Garante que a tabela de controle existe
          run_sql "CREATE SCHEMA IF NOT EXISTS supabase_migrations;
                   CREATE TABLE IF NOT EXISTS supabase_migrations.schema_migrations (
                     version text NOT NULL PRIMARY KEY
                   );"

          # Lê versões já aplicadas
          APPLIED=$(run_sql "SELECT version FROM supabase_migrations.schema_migrations" \
            | jq -r '.[].version' 2>/dev/null || true)

          # Aplica cada migration nova, em ordem
          for f in $(ls supabase/migrations/*.sql 2>/dev/null | sort); do
            VERSION=$(basename "$f" | grep -oE '^[0-9]+')
            if echo "$APPLIED" | grep -qx "$VERSION"; then
              echo "Skipping $VERSION (already applied)"
              continue
            fi
            echo "Applying $VERSION..."
            run_sql "$(cat "$f")" || { echo "::error::Migration $VERSION falhou"; exit 1; }
            run_sql "INSERT INTO supabase_migrations.schema_migrations(version)
                     VALUES ('$VERSION') ON CONFLICT DO NOTHING"
            echo "Applied $VERSION"
          done
          echo "Migrações concluídas"

      - name: Re-deploy Vercel — ${{ matrix.cliente.slug }}
        run: |
          TEAM_PARAM="${{ secrets.VERCEL_TEAM_ID != '' && format('?teamId={0}', secrets.VERCEL_TEAM_ID) || '' }}"
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"name\": \"agendamento-${{ matrix.cliente.slug }}\",
              \"project\": \"${{ matrix.cliente.vercel_project_id }}\",
              \"target\": \"production\",
              \"gitSource\": {
                \"type\": \"github\",
                \"ref\": \"main\",
                \"repoId\": \"${{ github.repository_id }}\"
              }
            }" \
            "https://api.vercel.com/v13/deployments$TEAM_PARAM"
