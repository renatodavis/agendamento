name: Provisionar novo cliente

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Identificador único, sem espaços (ex: clinica-exemplo)"
        required: true
      name:
        description: "Nome do cliente (ex: Clínica Exemplo)"
        required: true
      region:
        description: "Região Supabase"
        required: false
        default: "us-east-1"
      admin_email:
        description: "E-mail do usuário admin inicial (opcional)"
        required: false
        default: ""

jobs:
  provisionar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Verificar se slug já existe
        run: |
          EXISTS=$(jq -r --arg slug "${{ inputs.slug }}" '.[] | select(.slug == $slug) | .slug' clients.json)
          if [ -n "$EXISTS" ]; then
            echo "::error::Cliente com slug '${{ inputs.slug }}' já existe em clients.json. Escolha um slug diferente."
            exit 1
          fi

      - name: Instalar Supabase CLI
        run: |
          curl -sL https://github.com/supabase/cli/releases/download/v1.200.3/supabase_linux_amd64.tar.gz \
            | tar xz --overwrite -C /tmp
          sudo mv /tmp/supabase /usr/local/bin/supabase

      # ── Supabase ────────────────────────────────────────────────────────────
      - name: Criar projeto Supabase
        id: supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # Se já existe projeto com mesmo nome (run anterior falhou), deleta antes de criar
          EXISTING_ID=$(supabase projects list --output json \
            | jq -r '.[] | select(.name=="${{ inputs.name }}") | .id' | head -1)
          if [ -n "$EXISTING_ID" ]; then
            echo "Projeto '${{ inputs.name }}' já existe ($EXISTING_ID) — deletando para recriar..."
            curl -sf -X DELETE \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "https://api.supabase.com/v1/projects/$EXISTING_ID"
            echo "Projeto deletado. Aguardando 5s..."
            sleep 5
          fi

          DB_PASSWORD=$(openssl rand -base64 24 | tr -d '/+=' | cut -c1-24)
          echo "::add-mask::$DB_PASSWORD"
          echo "db_password=$DB_PASSWORD" >> "$GITHUB_OUTPUT"

          RESPONSE=$(supabase projects create "${{ inputs.name }}" \
            --org-id "${{ secrets.SUPABASE_ORG_ID }}" \
            --db-password "$DB_PASSWORD" \
            --region "${{ inputs.region }}" \
            --output json)

          PROJECT_ID=$(echo "$RESPONSE" | jq -r '.id')
          echo "project_id=$PROJECT_ID" >> "$GITHUB_OUTPUT"

          # Aguarda projeto ficar ativo (máx 5 min)
          for i in $(seq 1 30); do
            STATUS=$(supabase projects list --output json \
              | jq -r ".[] | select(.id==\"$PROJECT_ID\") | .status")
            echo "Status [$i/30]: $STATUS"
            if [ "$STATUS" = "ACTIVE_HEALTHY" ]; then break; fi
            sleep 10
          done
          if [ "$STATUS" != "ACTIVE_HEALTHY" ]; then echo "Timeout: projeto não ficou saudável"; exit 1; fi

      - name: Aplicar migrações
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          PROJECT_REF="${{ steps.supabase.outputs.project_id }}"
          API="https://api.supabase.com/v1/projects/$PROJECT_REF/database/query"

          run_sql() {
            local RESP HTTP_CODE BODY
            RESP=$(curl -s -w "\n%{http_code}" -X POST "$API" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              --data-raw "{\"query\": $(jq -Rs . <<< "$1")}")
            HTTP_CODE=$(echo "$RESP" | tail -1)
            BODY=$(echo "$RESP" | head -n -1)
            if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "201" ]; then
              echo "::error::SQL falhou HTTP $HTTP_CODE: $BODY"
              return 1
            fi
          }

          run_sql "CREATE SCHEMA IF NOT EXISTS supabase_migrations;
                   CREATE TABLE IF NOT EXISTS supabase_migrations.schema_migrations (
                     version text NOT NULL PRIMARY KEY
                   );"

          for f in $(ls supabase/migrations/*.sql 2>/dev/null | sort); do
            VERSION=$(basename "$f" | grep -oE '^[0-9]+')
            echo "Applying $VERSION..."
            run_sql "$(cat "$f")" || { echo "::error::Migration $VERSION falhou"; exit 1; }
            run_sql "INSERT INTO supabase_migrations.schema_migrations(version)
                     VALUES ('$VERSION') ON CONFLICT DO NOTHING"
          done
          echo "Migrações concluídas"

      - name: Buscar chaves do projeto
        id: keys
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          KEYS=$(curl -sf \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/${{ steps.supabase.outputs.project_id }}/api-keys")

          ANON=$(echo "$KEYS" | jq -r '.[] | select(.name=="anon") | .api_key')
          SERVICE=$(echo "$KEYS" | jq -r '.[] | select(.name=="service_role") | .api_key')
          echo "::add-mask::$SERVICE"

          echo "anon_key=$ANON" >> "$GITHUB_OUTPUT"
          echo "service_key=$SERVICE" >> "$GITHUB_OUTPUT"

      # ── Usuário admin inicial ────────────────────────────────────────────────
      - name: Configurar site_url do projeto Supabase
        if: ${{ inputs.admin_email != '' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          APP_URL="https://${{ inputs.slug }}.${{ secrets.BASE_DOMAIN }}"
          RESP=$(curl -s -w "\n%{http_code}" -X PATCH \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"site_url\": \"$APP_URL\"}" \
            "https://api.supabase.com/v1/projects/${{ steps.supabase.outputs.project_id }}/config/auth")
          HTTP_CODE=$(echo "$RESP" | tail -1)
          BODY=$(echo "$RESP" | head -n -1)
          echo "Auth config status: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Falha ao configurar site_url HTTP $HTTP_CODE: $BODY"
            exit 1
          fi
          echo "site_url configurado: $APP_URL"

      - name: Convidar usuário admin
        id: admin
        if: ${{ inputs.admin_email != '' }}
        run: |
          SERVICE_KEY="${{ steps.keys.outputs.service_key }}"
          PROJECT_REF="${{ steps.supabase.outputs.project_id }}"
          APP_URL="https://${{ inputs.slug }}.${{ secrets.BASE_DOMAIN }}"

          RESP=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer $SERVICE_KEY" \
            -H "apikey: $SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"email\": \"${{ inputs.admin_email }}\", \"redirect_to\": \"${APP_URL}/login\"}" \
            "https://$PROJECT_REF.supabase.co/auth/v1/invite")

          HTTP_CODE=$(echo "$RESP" | tail -1)
          BODY=$(echo "$RESP" | head -n -1)
          echo "Invite status: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "201" ]; then
            echo "::error::Falha ao convidar usuário admin HTTP $HTTP_CODE: $BODY"
            exit 1
          fi
          echo "Convite enviado para: ${{ inputs.admin_email }}"

      # ── Vercel ──────────────────────────────────────────────────────────────
      - name: Criar projeto Vercel
        id: vercel
        run: |
          TEAM_PARAM="${{ secrets.VERCEL_TEAM_ID != '' && format('?teamId={0}', secrets.VERCEL_TEAM_ID) || '' }}"
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"name\": \"agendamento-${{ inputs.slug }}\",
              \"framework\": \"nextjs\",
              \"gitRepository\": {
                \"type\": \"github\",
                \"repo\": \"${{ github.repository }}\"
              }
            }" \
            "https://api.vercel.com/v10/projects${TEAM_PARAM}")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "Vercel API status: $HTTP_CODE"
          echo "Vercel API response: $BODY"

          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "201" ]; then
            echo "::error::Vercel API retornou $HTTP_CODE: $BODY"
            exit 1
          fi

          PROJECT_ID=$(echo "$BODY" | jq -r '.id')
          echo "project_id=$PROJECT_ID" >> "$GITHUB_OUTPUT"

      - name: Configurar variáveis de ambiente no Vercel
        run: |
          SUP_URL="https://${{ steps.supabase.outputs.project_id }}.supabase.co"
          APP_URL="https://${{ inputs.slug }}.${{ secrets.BASE_DOMAIN }}"

          TEAM_PARAM="${{ secrets.VERCEL_TEAM_ID != '' && format('?teamId={0}', secrets.VERCEL_TEAM_ID) || '' }}"

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "[
              {\"key\":\"NEXT_PUBLIC_SUPABASE_URL\",\"value\":\"$SUP_URL\",\"type\":\"plain\",\"target\":[\"production\",\"preview\"]},
              {\"key\":\"NEXT_PUBLIC_SUPABASE_ANON_KEY\",\"value\":\"${{ steps.keys.outputs.anon_key }}\",\"type\":\"plain\",\"target\":[\"production\",\"preview\"]},
              {\"key\":\"SUPABASE_SERVICE_ROLE_KEY\",\"value\":\"${{ steps.keys.outputs.service_key }}\",\"type\":\"sensitive\",\"target\":[\"production\"]},
              {\"key\":\"NEXT_PUBLIC_APP_URL\",\"value\":\"$APP_URL\",\"type\":\"plain\",\"target\":[\"production\"]}
            ]" \
            "https://api.vercel.com/v10/projects/${{ steps.vercel.outputs.project_id }}/env$TEAM_PARAM")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "Vercel env status: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "201" ]; then
            echo "::error::Vercel env vars falhou $HTTP_CODE: $BODY"
            exit 1
          fi

      # ── Domínio ─────────────────────────────────────────────────────────────
      - name: Adicionar subdomínio na Vercel
        run: |
          SUBDOMAIN="${{ inputs.slug }}.${{ secrets.BASE_DOMAIN }}"
          TEAM_PARAM="${{ secrets.VERCEL_TEAM_ID != '' && format('?teamId={0}', secrets.VERCEL_TEAM_ID) || '' }}"
          RESP=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"name\": \"$SUBDOMAIN\"}" \
            "https://api.vercel.com/v10/projects/${{ steps.vercel.outputs.project_id }}/domains${TEAM_PARAM}")
          HTTP_CODE=$(echo "$RESP" | tail -1)
          BODY=$(echo "$RESP" | head -n -1)
          echo "Domain status: $HTTP_CODE — $BODY"
          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "201" ]; then
            echo "::warning::Falha ao adicionar domínio HTTP $HTTP_CODE: $BODY"
          else
            echo "Subdomínio configurado: $SUBDOMAIN"
          fi

      # ── Registro ────────────────────────────────────────────────────────────
      - name: Atualizar clients.json e commitar
        run: |
          jq --arg slug "${{ inputs.slug }}" \
             --arg name "${{ inputs.name }}" \
             --arg sup_id "${{ steps.supabase.outputs.project_id }}" \
             --arg ver_id "${{ steps.vercel.outputs.project_id }}" \
             --arg sub "${{ inputs.slug }}" \
             '. + [{slug: $slug, name: $name, subdomain: $sub, supabase_project_id: $sup_id, vercel_project_id: $ver_id}]' \
             clients.json > clients.tmp && mv clients.tmp clients.json

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add clients.json
          git commit -m "chore: provisionar cliente ${{ inputs.slug }}"
          git push

      # ── Deploy inicial ───────────────────────────────────────────────────────
      - name: Disparar primeiro deploy
        run: |
          TEAM_PARAM="${{ secrets.VERCEL_TEAM_ID != '' && format('?teamId={0}', secrets.VERCEL_TEAM_ID) || '' }}"
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"name\": \"agendamento-${{ inputs.slug }}\",
              \"project\": \"${{ steps.vercel.outputs.project_id }}\",
              \"target\": \"production\",
              \"gitSource\": {
                \"type\": \"github\",
                \"ref\": \"main\",
                \"repoId\": \"${{ github.repository_id }}\"
              }
            }" \
            "https://api.vercel.com/v13/deployments$TEAM_PARAM")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "Deploy status: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "201" ]; then
            echo "::error::Deploy falhou $HTTP_CODE: $BODY"
            exit 1
          fi

      - name: Resumo
        run: |
          {
            echo "## ✅ Cliente provisionado"
            echo "| Campo | Valor |"
            echo "|-------|-------|"
            echo "| Slug | \`${{ inputs.slug }}\` |"
            echo "| Supabase | https://app.supabase.com/project/${{ steps.supabase.outputs.project_id }} |"
            echo "| Vercel | https://vercel.com/dashboard |"
            echo "| URL esperada | https://${{ inputs.slug }}.${{ secrets.BASE_DOMAIN }} |"
            echo ""
            echo "### Próximos passos manuais"
            echo "1. **GitHub** → Settings → Secrets → \`SUPABASE_DB_PASSWORDS\` → adicionar entrada \`\"${{ inputs.slug }}\": \"<senha>\"\`"
            echo "   - Senha disponível em: Supabase Dashboard → projeto → Settings → Database"
            echo "2. Vercel → Settings → Environment Variables → adicionar \`ANTHROPIC_API_KEY\`, \`WHATSAPP_*\`"
            echo "3. Meta Developer → WABA → configurar webhook override para a nova URL"
            if [ -n "${{ inputs.admin_email }}" ]; then
              echo ""
              echo "### 📧 Convite admin enviado"
              echo "| Campo | Valor |"
              echo "|-------|-------|"
              echo "| E-mail | \`${{ inputs.admin_email }}\` |"
              echo "| URL do app | https://${{ inputs.slug }}.${{ secrets.BASE_DOMAIN }} |"
              echo ""
              echo "> O usuário receberá um e-mail com link para definir a senha e acessar o sistema."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
